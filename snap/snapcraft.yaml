name: beremiz
adopt-info: beremiz
title: Beremiz
summary: Beremiz Open Source PLC.
description: |
  Beremiz is a framework for machine automation. It is meant to add PLC-like programing to embedded systems.

  Beremiz is [Free Software](https://en.wikipedia.org/wiki/Free_software), and conforms to
  [IEC_61131](https://en.wikipedia.org/wiki/IEC_61131-3) and [PLCopen](https://plcopen.org/technical-activities/xml-exchange) among other standards.

  Beremiz supports all languages described in IEC_61131:
  * Structured Text (ST)
  * Instruction List (IL)
  * Function Block Diagram (FBD)
  * Sequencial Function Chart (SFC)
  * Ladder Diagram (LD)

  IDE also includes tools to create Human-Machine Interfaces (HMI), and to connect your PLC programs to existing supervisions, databases, or fieldbuses:
  * Modbus
  * OPC-UA
  * CANopen
  * SVG HMI
  * Wx HMI
  * Python
  * ...

  Runtime can be programmed remotely and allows variables tracing and forcing.

icon: snap/gui/beremiz.png
contact: 
  - https://beremiz.org
  - snap@beremiz.fr


grade: stable
confinement: strict
base: core24
platforms:
  amd64:
  arm64:

parts:

  beremiz:
    # Beremiz python source and dependencies, inc. native GCC
    # source tree is expected to be just aside snap directory
    plugin: python
    source: beremiz
    source-type: local
    # wxPython is provided at runtime by the staged python3-wxgtk4.0 deb, not
    # by pip:
    #   - requirements_snap.txt is requirements_pinned.txt with the wxpython
    #     line filtered out (generated in override-build). The python plugin
    #     installs requirements with `pip install -U`; with -U pip would
    #     rebuild wxpython from the PyPI sdist instead of using the deb, so we
    #     keep it out of pip's input entirely. (Same approach as the wxPython
    #     filter in windows_installer.mk.)
    #   - The deb installs wx into usr/lib/python3/dist-packages, staged into
    #     the payload. With the gnome extension the venv's base interpreter is
    #     the gnome platform's python (base_prefix=/usr at runtime), so neither
    #     --system-site-packages nor the staged payload is searched for it. The
    #     .pth written to the venv site-packages in override-build adds
    #     $SNAP/usr/lib/python3/dist-packages to sys.path so `import wx` works;
    #     .pth dirs are searched after the venv's own packages, so pip-installed
    #     deps keep priority.
    # PARTS_PYTHON_VENV_ARGS is consumed by the craft-parts python plugin:
    # https://github.com/canonical/craft-parts/blob/main/craft_parts/plugins/python_plugin.py
    python-requirements:
      - requirements_snap.txt
    build-environment:
      - PARTS_PYTHON_VENV_ARGS: --system-site-packages
      # libssl-dev installs opensslconf.h under the arch-triplet include dir
      # (usr/include/$triplet/openssl/), which gcc doesn't search by default
      # when pip builds C extensions like sslpsk against the staged headers.
      - CPPFLAGS: -I$CRAFT_PART_INSTALL/usr/include/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    build-packages:
      - git
      - libssl-dev
    # native GCC toolchain
    # note: GCC toolchain cannot be move to separate part
    # otherwise there is a file conflict about lib64 in prime step
    # caused apparently by libc6 (needed to have consistent sysroot)
    stage-packages:
      - gcc
      - libc6
      - libc6-dev
      - linux-libc-dev
      - libgcc-s1
      - python3-wxgtk4.0
    override-pull: |
      craftctl default
      craftctl set version="$(python3 $CRAFT_PART_SRC/version.py)"
    override-build: |
      # Produce requirements_snap.txt = requirements_pinned.txt without
      # wxpython (provided by the staged deb; see note above). Done before
      # craftctl default so the plugin's pip install picks it up.
      grep -v -i wxpython requirements_pinned.txt > requirements_snap.txt
      craftctl default
      # Put the staged python3-wxgtk4.0 (usr/lib/python3/dist-packages) on the
      # venv's path; see note above. Relative path so it stays valid when
      # $CRAFT_PART_INSTALL is remapped to $SNAP at install time.
      for sp in "$CRAFT_PART_INSTALL"/lib/python3.*/site-packages; do
        echo '../../../usr/lib/python3/dist-packages' > "$sp/snap-dist-packages.pth"
      done
      # The staged gcc compiles the PLC runtime with --sysroot=$SNAP. libc's
      # linker script and gcc's specs reference libc.so.6 and the ELF
      # interpreter by absolute /lib paths; under the sysroot ld looks for them
      # at $SNAP/lib/... The payload has no merged-/usr symlinks (snapcraft
      # doesn't stage base-files' /lib->usr/lib, and the venv owns a real /lib),
      # so add compatibility links so ld resolves them through the sysroot.
      # ($SNAP/lib64 is already a symlink to lib, so /lib64/<interp> resolves
      # via the /lib/<interp> link below.)
      triplet="$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      ln -sfn "../usr/lib/$triplet" "$CRAFT_PART_INSTALL/lib/$triplet"
      ldso="$(cd "$CRAFT_PART_INSTALL/usr/lib/$triplet" && echo ld-*.so.*)"
      ln -sfn "$triplet/$ldso" "$CRAFT_PART_INSTALL/lib/$ldso"
      cp -a "$CRAFT_PART_SRC" "$CRAFT_PART_INSTALL/beremiz"
      # Pre-compile beremiz sources to populate __pycache__ so the IDE starts
      # faster on first launch. Mirrors the compileall pass in
      # windows_installer.mk; same exclusion list (etherlab/, web_settings.py,
      # tests/, exemples/ are either generated, runtime-templated, or unused
      # at IDE runtime).
      cd "$CRAFT_PART_INSTALL/beremiz" && \
        find . -name '*.py' \
          | grep -v -e '\./etherlab' -e '.*/web_settings\.py' \
                    -e '\./tests'    -e '\./exemples' \
          > tocompile.lst && \
        python3 -m compileall -q -i tocompile.lst && \
        rm tocompile.lst

  matiec:
    # Matiec ST, SFC and IL compiler.
    # source tree is expected to be just aside snap directory
    plugin: nil
    source: matiec
    source-type: local
    build-packages:
      - build-essential
      - automake
      - flex
      - bison
    override-build: |
      autoreconf -i && ./configure && make
      cp -a $CRAFT_PART_BUILD $CRAFT_PART_INSTALL/matiec

  modbus:
    plugin: nil
    source: Modbus
    source-type: local
    build-packages:
      - build-essential
      - automake
    override-build: |
      make
      cp -a $CRAFT_PART_BUILD $CRAFT_PART_INSTALL/Modbus

  open62541:
    plugin: nil
    source: open62541
    source-type: local
    build-packages:
      - build-essential
      - cmake
    override-build: |
      mkdir build && cd build && cmake .. && make
      cp -a $CRAFT_PART_BUILD $CRAFT_PART_INSTALL/open62541
      
  inkscape:
    # CLI only, used in SVGHMI build
    # GUI fails to launch couldn't find a way
    plugin: nil
    stage-packages:
      - inkscape
  revisiontxt:
    # Makefile generated "revisions.txt"
    plugin: nil
    source: .
    source-type: local
    override-build: |
      cp $CRAFT_PART_SRC/revisions.txt $CRAFT_PART_INSTALL

apps:
  ide:
    # Launcher for the IDE.
    extensions: [gnome]
    environment:
      SYSROOT: $SNAP
    command: bin/python3 $SNAP/beremiz/Beremiz.py
    plugs:
      - network
      - network-bind
      - home
      - removable-media

  beremiz:
    # Beremiz Command Line interface
    environment:
      SYSROOT: $SNAP
    command: bin/python3 $SNAP/beremiz/Beremiz_cli.py
    plugs:
      - network
      - network-bind
 
  runtime:
    # Standalone runtime
    environment:
      SYSROOT: $SNAP
    command: bin/python3 $SNAP/beremiz/Beremiz_service.py
    plugs:
      - network
      - network-bind

