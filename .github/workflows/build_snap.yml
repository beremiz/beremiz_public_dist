name: Build Snap

on:
  workflow_dispatch:
  # push:
  #   branches: [ default ]

jobs:
  sources:
    uses: ./.github/workflows/prep_sources.yml
    secrets: inherit

  build:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:

    - name: Download source artifact
      uses: actions/download-artifact@v7
      with:
        name: source_package

    - name: untar files
      run: tar -xvf sources.tar

    - name: Move snap dir and revisions.txt in build/sources
      run: |
        mv beremiz_public_dist/snap build/sources
        mv build/revisions.txt build/sources/revisions.txt

    - name: Invoke snapcraft build
      uses: snapcore/action-build@v1
      id: snapcraft
      with:
        path: build/sources

    - name: Upload built artifact
      uses: actions/upload-artifact@v6
      with:
        name: snap-${{ matrix.arch }}
        path: ${{ steps.snapcraft.outputs.snap }}


